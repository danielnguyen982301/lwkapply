<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LwkApply</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applies the persisted/system theme before Vue mounts, so there's no
      // flash of the wrong theme on load. src/stores/theme.ts re-reads the
      // same localStorage key on init and takes over from here — this
      // inline script only ever runs once, on the initial page load.
      ;(function () {
        var STORAGE_KEY = 'theme-mode'
        var mode = localStorage.getItem(STORAGE_KEY) || 'system'
        var isDark =
          mode === 'dark' ||
          (mode === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (isDark) document.documentElement.classList.add('app-dark')
      })()
    </script>
  </head>
  <body class="bg-paper text-ink font-sans antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
