name: Reminders Cron

# Replaces Celery beat's every-10-minutes schedule
# (backend/app/core/celery_app.py's beat_schedule) for deployments that
# don't run a Celery worker/beat process - Render has no free tier for
# an always-on background worker, see backend/BACKEND_SUMMARY.md's
# "Background job execution" section. Hits
# POST /api/v1/internal/reminders/run instead, which does the same
# find-due/dispatch/mark-sent work as
# backend/app/tasks/reminders_celery.py::send_due_reminders (via
# backend/app/tasks/reminders_inline.py, the version this endpoint
# actually calls).
#
# Requires two repo-level values under Settings > Secrets and variables
# > Actions:
#   - Secret INTERNAL_CRON_SECRET: same value as the backend's
#     INTERNAL_CRON_SECRET env var (see backend/.env.example).
#   - Variable BACKEND_URL: the deployed API's base URL, no trailing
#     slash (e.g. https://lwkapply-api.onrender.com).
# Until both are set this workflow will 401/503 against the endpoint -
# harmless (idempotent, nothing to retry), but reminders won't send.
#
# DISABLED (Actions tab -> this workflow -> toggled off) as of the
# GMAIL_API_* / auth-cookie deployment pass - see CHANGELOG.md v0.19.0.
# GitHub's scheduled workflows are documented as best-effort, but in
# practice this one went well beyond "a few minutes late": real run
# history showed multi-hour gaps with the schedule trigger firing zero
# times, not just landing late - worse than the idempotency-covers-a-
# late-tick reasoning this comment originally assumed. cron-job.org is
# the actual scheduler in production now (same endpoint, more punctual
# in practice). This file is kept, disabled, as a free redundant
# fallback that costs nothing while off and can be re-enabled (Actions
# tab -> this workflow -> "Enable workflow") if cron-job.org itself
# ever needs a backup - workflow_dispatch below still works for manual
# testing regardless of the schedule trigger's on/off state.
on:
  schedule:
    # Every 10 minutes - matches celery beat's original cadence exactly
    # (app/core/celery_app.py's beat_schedule) rather than just landing
    # somewhere in TODO.md's "every 5-15 min" window. This repo is
    # public, so GitHub Actions minutes are unmetered - no cost reason
    # to space runs out further; if this workflow is ever copied into a
    # private repo, note that private repos get a limited free minutes/
    # month budget and every scheduled run bills at least 1 minute.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  run-due-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger send-due-reminders
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST \
            -H "X-Internal-Cron-Secret: ${{ secrets.INTERNAL_CRON_SECRET }}" \
            "${{ vars.BACKEND_URL }}/api/v1/internal/reminders/run")
          cat /tmp/response.json
          echo
          if [ "$status" -ge 300 ]; then
            echo "Request failed with status $status"
            exit 1
          fi
