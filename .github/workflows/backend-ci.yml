name: Backend CI

# Runs on every push and PR touching the backend, so lint/test failures
# are caught before merge rather than discovered manually (see: the
# bcrypt/passlib incompatibility bug that shipped without this in place).
on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run ruff (lint)
        run: ruff check .

      - name: Run ruff (format check)
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    # test_contacts_directory.py (the first API/integration test) needs a
    # real Postgres instance - Contact/Application/User all use the
    # Postgres-specific UUID dialect type, so SQLite can't stand in here.
    # Redis is here for the same reason, one layer up the stack:
    # test_rate_limit.py and TestAiRateLimiting in test_ai_endpoints.py
    # exercise app/services/rate_limit.py against a real Redis instance
    # rather than mocking it (same "use the real dependency you already
    # provision" philosophy as the Postgres tests) - without this
    # service, REDIS_URL's default (redis://localhost:6379/0) has
    # nothing listening on the runner.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lwkapply_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/lwkapply_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing
