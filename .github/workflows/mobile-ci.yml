name: Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
  pull_request:
    paths:
      - "mobile/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Create env files
        # .env.development / .env.production are gitignored (see SETUP.md) —
        # CI needs them to exist on disk too, since pubspec.yaml declares
        # them as assets and `flutter analyze`/build fail if a declared
        # asset is missing. Values here only need to be *present*, not
        # point at a real API — nothing in CI actually calls the backend.
        run: |
          cp .env.example .env.development
          cp .env.example .env.production

      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage

      - name: Build (Android, no signing)
        run: flutter build apk --debug
